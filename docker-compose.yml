version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: leadgen-postgres
    environment:
      POSTGRES_DB: leadgen
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leadgen"]
      interval: 10s
      timeout: 5s
      retries: 5

  dbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: leadgen-dbeaver
    ports:
      - "8978:8978"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CB_DB_URL: jdbc:postgresql://postgres:5432/leadgen
      CB_DB_USER: postgres
      CB_DB_PASSWORD: postgres

volumes:
  postgres_data:
